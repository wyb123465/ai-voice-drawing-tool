<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f3eb">
    <title>AI Voice Drawing Studio</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="AI voice drawing workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">XEngineer · AI voice drawing</p>
            <h1>声绘工作台</h1>
          </div>
          <div class="voice-status" data-state="idle">
            <span class="pulse" aria-hidden="true"></span>
            <span id="voiceStatus">待启动</span>
          </div>
        </header>

        <section class="stage-wrap" aria-label="drawing stage">
          <canvas id="drawingCanvas" width="1280" height="800"></canvas>
        </section>
      </section>

      <aside class="control-rail" aria-label="voice controls">
        <div class="action-stack" aria-label="primary actions">
          <button id="startVoice" class="primary-action" type="button">启动语音</button>
          <button id="runReviewDemo" class="secondary-action" type="button">运行评审演示</button>
          <button id="stopVoice" class="icon-action" type="button" aria-label="Stop voice mode">停止</button>
        </div>

        <section class="panel metrics-panel" aria-labelledby="metricsTitle">
          <h2 id="metricsTitle">运行看板</h2>
          <dl class="metrics-grid" aria-live="polite">
            <div>
              <dt>对象</dt>
              <dd id="metricObjects">0</dd>
            </div>
            <div>
              <dt>历史</dt>
              <dd id="metricHistory">0</dd>
            </div>
            <div>
              <dt>来源</dt>
              <dd id="metricSource">待执行</dd>
            </div>
            <div>
              <dt>最近</dt>
              <dd id="metricLastAction">等待指令</dd>
            </div>
          </dl>
        </section>

        <section class="panel llm-panel" aria-labelledby="llmTitle">
          <h2 id="llmTitle">AI 兜底</h2>
          <div class="llm-status-row">
            <span class="llm-dot" aria-hidden="true"></span>
            <span id="llmMode">规则优先 · 默认离线</span>
          </div>
          <p id="llmDescription" class="llm-description">常见指令由本地规则解析；开放表达或低置信度指令才进入 LLM 兜底，并经过白名单校验后执行。</p>
          <button id="runLlmExample" class="secondary-action compact-action" type="button">试试：画一只猫</button>
        </section>

        <section class="panel clarification-panel" aria-labelledby="clarificationTitle">
          <h2 id="clarificationTitle">澄清追问</h2>
          <p id="clarificationStatus" class="clarification-status" aria-live="polite">暂无待确认问题。</p>
        </section>

        <section class="panel review-panel" aria-labelledby="reviewDemoTitle">
          <h2 id="reviewDemoTitle">评审脚本</h2>
          <ol id="reviewDemoSteps" class="review-steps"></ol>
        </section>

        <section class="panel">
          <h2>实时语音</h2>
          <p id="liveTranscript" class="transcript">等待麦克风输入</p>
        </section>

        <section class="panel fallback-panel" id="fallbackPanel" hidden>
          <h2 id="fallbackTitle">文本回放</h2>
          <label class="field-label" for="fallbackInput">输入指令</label>
          <textarea id="fallbackInput" rows="4" autocomplete="off" spellcheck="false"></textarea>
          <button id="runFallback" class="secondary-action" type="button">执行</button>
        </section>

        <section class="panel">
          <h2>解析结果</h2>
          <ol id="commandLog" class="command-log" aria-live="polite"></ol>
        </section>
      </aside>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
